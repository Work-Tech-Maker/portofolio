name: Deploy ke Hostinger (FTPS)

# Kapan berjalan:
#  1. otomatis setiap ada push ke branch main (setelah PR di-merge),
#  2. manual dari tab Actions (berguna untuk uji "dry run" sebelum benar-benar mengunggah).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — hanya menampilkan rencana perubahan, tidak mengunggah'
        type: choice
        options: ['false', 'true']
        default: 'false'
      server_dir:
        description: 'Folder tujuan di Hostinger (kosongkan = dicoba otomatis)'
        type: string
        required: false

# Satu deploy pada satu waktu; push baru membatalkan deploy yang belum selesai.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Folder tujuan bawaan = AKAR login FTP.
  # Dibuktikan 27 Okt 2026 lewat pemeriksaan nyata: akun FTP ini sudah dibatasi
  # ke folder subdomain (isi akarnya: default.php), sedangkan folder
  # "public_html/" dan "domains/..." TIDAK ada di dalamnya. Menulis ke
  # "domains/..." membuat folder bersarang dan situs tidak tampil di akar domain.
  DIR_BAWAAN: ./

jobs:
  deploy:
    name: Bangun & unggah
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil kode terbaru
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      # Gerbang mutu: kalau lint gagal, deploy dibatalkan.
      - name: Periksa kode (lint)
        run: npm run lint

      - name: Bangun situs
        run: npm run build

      # Pengaman: pastikan hasil build memang ada dan tidak membawa berkas rahasia.
      - name: Verifikasi hasil build
        run: |
          set -e
          echo "== Isi dist =="
          find dist -type f | sort
          test -f dist/index.html || { echo "::error::dist/index.html tidak ada"; exit 1; }
          grep -q '<title>' dist/index.html || { echo "::error::index.html tanpa <title>"; exit 1; }
          test -n "$(find dist/assets -name '*.js' -print -quit)" || { echo "::error::bundel JS tidak ditemukan"; exit 1; }
          if find dist -name '.env*' -o -name '*.pem' -o -name 'config.php' | grep -q .; then
            echo "::error::ada berkas rahasia di dist"; exit 1;
          fi
          echo "OK: hasil build lengkap dan bersih"

      # Periksa setelan FTP sebelum menyentuh server. Isi rahasia TIDAK dicetak,
      # hanya panjangnya. Nilai host dirapikan (buang spasi/skema/garis miring).
      - name: Periksa setelan FTP
        id: periksa
        env:
          HOST_MENTAH: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          AKUN: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          SANDI: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          DARI_INPUT: ${{ inputs.server_dir }}
          DARI_SECRET: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${HOST_MENTAH:-}" ] || [ -z "${AKUN:-}" ] || [ -z "${SANDI:-}" ]; then
            echo "::error::Secret FTP_SERVER / FTP_USERNAME / FTP_PASSWORD belum lengkap. Isi di Settings > Secrets and variables > Actions."
            exit 1
          fi

          H="$(printf '%s' "$HOST_MENTAH" | tr -d '[:space:]' | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#/*$##')"
          echo "Host FTP dipakai : '$H'"
          echo "Nama pengguna    : '$AKUN'"
          echo "Panjang sandi    : ${#SANDI} karakter (isi tidak dicetak)"
          echo "ftp_host=$H" >> "$GITHUB_OUTPUT"

          if [ "$H" != "$(printf '%s' "$HOST_MENTAH" | tr -d '[:space:]')" ]; then
            echo "::warning::Nilai FTP_SERVER mengandung skema atau garis miring; workflow memakai versi yang sudah dirapikan."
          fi

          # Alamat IP tidak perlu resolusi DNS (pencarian balik IP justru sering gagal).
          if printf '%s' "$H" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$|:'; then
            echo "Bentuk host      : alamat IP, pemeriksaan DNS dilewati"
            echo "::notice::Host FTP berupa alamat IP: $H"
          elif getent hosts "$H" > /dev/null; then
            echo "DNS              : berhasil di-resolve"
            echo "::notice::Host FTP bisa di-resolve: $H"
          else
            echo "::error::Host FTP '$H' tidak bisa di-resolve. Periksa nilai secret FTP_SERVER (isi alamat saja, tanpa ftp://)."
            exit 1
          fi

          if timeout 15 bash -c "</dev/tcp/$H/21" 2>/dev/null; then
            echo "Port 21          : terbuka"
            echo "::notice::Port 21 terbuka di $H"
          else
            echo "::error::Port 21 di '$H' tidak bisa dihubungi dari GitHub Actions. Aktifkan FTP di hPanel atau periksa firewall hosting."
            exit 1
          fi

          # --- Diagnosis ringan: hanya membaca, tidak mengubah apa pun ---
          # (-k dipakai supaya sertifikat FTPS tidak menggagalkan pemeriksaan;
          #  unggahan sebenarnya memakai pengaturan aksi itu sendiri)
          # Daftar isi folder (hanya stdout; pesan galat dibuang agar tidak dikira isi).
          daftar() {
            curl -sS -k --connect-timeout 15 --ssl-reqd --ftp-pasv \
              --user "$AKUN:$SANDI" --list-only "$1" 2>/dev/null | head -40 | tr '\n' ' '
          }
          # Uji keberadaan folder lewat kode keluar curl (550 = tidak ada).
          ada() {
            curl -sS -k --connect-timeout 15 --ssl-reqd --ftp-pasv \
              --user "$AKUN:$SANDI" --list-only "$1" > /dev/null 2>&1
          }

          AKAR="$(daftar "ftp://$H/")"
          echo "Isi akar FTP: ${AKAR:-<kosong atau gagal dibaca>}"
          echo "::notice::Isi akar FTP: ${AKAR:-<kosong atau gagal dibaca>}"

          for k in "${{ env.DIR_BAWAAN }}" "$FOLDER_MANUAL"; do
            [ -n "$k" ] || continue
            if ada "ftp://$H/$k"; then
              echo "ADA: $k   isi: $(daftar "ftp://$H/$k")"
              echo "::notice::Folder ADA: $k | isi: $(daftar "ftp://$H/$k")"
            else
              echo "TIDAK ADA: $k"
              echo "::notice::Folder TIDAK ADA: $k"
            fi
          done

          # Folder tujuan yang ditentukan sendiri: input manual lebih diutamakan
          # daripada secret. Kalau keduanya kosong, workflow mencoba dua jalur
          # bawaan. Nilai ini dipakai lewat variabel lingkungan karena context
          # `secrets` tidak boleh dipakai di dalam `if`.
          if [ -n "${DARI_INPUT:-}" ]; then
            FOLDER_MANUAL="$DARI_INPUT"
          elif [ -n "${DARI_SECRET:-}" ]; then
            FOLDER_MANUAL="$DARI_SECRET"
          else
            FOLDER_MANUAL=""
          fi

          if [ -n "$FOLDER_MANUAL" ]; then
            echo "Folder tujuan    : '$FOLDER_MANUAL' (dari setelan manual)"
            echo "folder_tujuan=$FOLDER_MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "Folder tujuan    : '${{ env.DIR_BAWAAN }}' (akar login FTP, bawaan)"
            echo "folder_tujuan=${{ env.DIR_BAWAAN }}" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Unggah. Yang dikirim HANYA isi dist/ (bukan seluruh repo).
      # Folder tujuan: akar login FTP (bawaan), kecuali diisi sendiri lewat
      # kolom server_dir saat menjalankan manual atau secret FTP_SERVER_DIR.
      # ---------------------------------------------------------------------
      - name: Unggah ke Hostinger
        id: unggah
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.periksa.outputs.ftp_host }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.periksa.outputs.folder_tujuan }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          log-level: standard
          timeout: 60000

      - name: Laporkan hasil unggah
        if: ${{ always() }}
        env:
          HASIL: ${{ steps.unggah.outcome }}
          FOLDER: ${{ steps.periksa.outputs.folder_tujuan }}
        run: |
          set -euo pipefail
          echo "Folder tujuan : $FOLDER"
          echo "Hasil unggah  : ${HASIL:-tidak dijalankan}"
          echo "::notice::Unggah ke '$FOLDER' -> ${HASIL:-tidak dijalankan}"

          if [ "${HASIL:-}" = "success" ]; then
            echo "Deploy berhasil."
            exit 0
          fi

          echo "::error::Unggahan gagal. Buka langkah 'Unggah ke Hostinger' untuk melihat pesan dari server hosting, lalu jalankan ulang secara manual dengan kolom server_dir diisi (lihat docs/deploy.md bagian 2 dan 5)."
          exit 1