name: Deploy ke Hostinger (FTPS)

# Kapan berjalan:
#  1. otomatis setiap ada push ke branch main (setelah PR di-merge),
#  2. manual dari tab Actions (berguna untuk uji "dry run" sebelum benar-benar mengunggah).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — hanya menampilkan rencana perubahan, tidak mengunggah'
        type: choice
        options: ['false', 'true']
        default: 'false'
      server_dir:
        description: 'Folder tujuan di Hostinger (kosongkan untuk memakai default)'
        type: string
        required: false

# Satu deploy pada satu waktu; push baru membatalkan deploy yang belum selesai.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Bangun & unggah
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil kode terbaru
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      # Gerbang mutu: kalau lint gagal, deploy dibatalkan.
      - name: Periksa kode (lint)
        run: npm run lint

      - name: Bangun situs
        run: npm run build

      # Pengaman: pastikan hasil build memang ada dan tidak membawa berkas rahasia.
      - name: Verifikasi hasil build
        run: |
          set -e
          echo "== Isi dist =="
          find dist -type f | sort
          test -f dist/index.html || { echo "GAGAL: dist/index.html tidak ada"; exit 1; }
          grep -q '<title>' dist/index.html || { echo "GAGAL: index.html tanpa <title>"; exit 1; }
          test -n "$(find dist/assets -name '*.js' -print -quit)" || { echo "GAGAL: bundel JS tidak ditemukan"; exit 1; }
          if find dist -name '.env*' -o -name '*.pem' -o -name 'config.php' | grep -q .; then
            echo "GAGAL: ada berkas rahasia di dist"; exit 1;
          fi
          echo "OK: hasil build lengkap dan bersih"

      # Folder tujuan berbeda-beda antarpaket hosting:
      #   - bila login FTP masuk ke akar akun  -> domains/<domain>/public_html/
      #   - bila login FTP langsung ke domain   -> public_html/
      # Langkah ini MEMERIKSA satu per satu lewat FTP (hanya membaca daftar folder,
      # tidak menulis apa pun) lalu memilih yang benar-benar ada. Urutan prioritas:
      # input manual > secret FTP_SERVER_DIR > hasil deteksi.
      - name: Tentukan folder tujuan di hosting
        id: tujuan
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          AKUN: ${{ secrets.FTP_USERNAME }}
          SANDI: ${{ secrets.FTP_PASSWORD }}
          DARI_INPUT: ${{ inputs.server_dir }}
          DARI_SECRET: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail

          pilih() {
            echo "server_dir=$1" >> "$GITHUB_OUTPUT"
            echo "== Folder tujuan dipakai: $1 =="
          }

          if [ -n "${DARI_INPUT:-}" ]; then pilih "$DARI_INPUT"; exit 0; fi
          if [ -n "${DARI_SECRET:-}" ]; then pilih "$DARI_SECRET"; exit 0; fi

          if [ -z "${HOST:-}" ] || [ -z "${AKUN:-}" ] || [ -z "${SANDI:-}" ]; then
            echo "::error::Secret FTP_SERVER / FTP_USERNAME / FTP_PASSWORD belum lengkap."
            exit 1
          fi

          echo "== Isi akar FTP (untuk diagnosis) =="
          curl -sS --connect-timeout 20 --ssl-reqd --ftp-pasv \
            --user "$AKUN:$SANDI" --list-only "ftp://$HOST/" || true

          KANDIDAT=(
            "domains/indragunawan.luckywater.web.id/public_html/"
            "public_html/"
          )

          for k in "${KANDIDAT[@]}"; do
            if curl -sS --connect-timeout 20 --ssl-reqd --ftp-pasv \
                 --user "$AKUN:$SANDI" --list-only "ftp://$HOST/$k" > /dev/null; then
              echo "Ditemukan: $k"
              pilih "$k"
              exit 0
            fi
            echo "Tidak ditemukan: $k"
          done

          echo "::error::Folder tujuan tidak ditemukan otomatis. Jalankan workflow manual (Run workflow) dengan kolom server_dir diisi path dari File Manager hPanel. Lihat docs/deploy.md bagian 2."
          exit 1

      # Yang diunggah HANYA isi dist/ (bukan seluruh repo). Tanpa local-dir,
      # yang terunggah adalah kode sumber dan situs tidak akan jalan.
      - name: Unggah ke Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.tujuan.outputs.server_dir }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          log-level: standard
          timeout: 60000